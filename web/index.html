<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Books</h1>
    <p id="status" role="status"></p>

    <form id="book-form">
      <h2 id="form-title">Add a book</h2>
      <input type="hidden" id="bookId">
      <label>Title (English)<input id="englishTitle" required maxlength="200"></label>
      <label>Title (Original if not English) <input id="originalTitle" maxlength="200"></label>
      <label>Author <input id="author" maxlength="100"></label>
      <label>Year of 1st edition <input id="firstEditionYear" type="number" min="-5000", max="2026" <!-- yeah bad hardcoding --> ></label>
      <div class="buttons">
        <button type="submit" id="save-btn">Add book</button>
        <button type="button" id="cancel-btn" hidden>Cancel edit</button>
      </div>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Title</th><th>Author</th><th>First Edition</th></tr>
      </thead>
      <tbody id="book-rows"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
