<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Students</h1>
    <p id="status" role="status"></p>

    <form id="student-form">
      <h2 id="form-title">Add a student</h2>
      <input type="hidden" id="studentId">
      <label>First name <input id="firstName" required maxlength="50"></label>
      <label>Last name <input id="lastName" required maxlength="50"></label>
      <label>Program <input id="program" maxlength="100"></label>
      <label>Email <input id="email" type="email" maxlength="150"></label>
      <div class="buttons">
        <button type="submit" id="save-btn">Add student</button>
        <button type="button" id="cancel-btn" hidden>Cancel edit</button>
      </div>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Program</th><th>Email</th><th></th></tr>
      </thead>
      <tbody id="student-rows"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
